<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growatt Inverter Monitor</title>
    <!-- Tailwind CSS для стилізації -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans">

    <div class="max-w-md mx-auto w-full space-y-4">
        <!-- Шапка -->
        <div class="flex items-center justify-between bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-lg font-bold text-emerald-400">Сонячна станція</h1>
                <p class="text-xs text-slate-400">Plant ID: 4137574</p>
            </div>
            <div id="status-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">
                Завантаження...
            </div>
        </div>

        <!-- Головна картка показників -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 space-y-6">
            <div class="text-center space-y-1">
                <span class="text-sm text-slate-400 uppercase tracking-wider">Поточна потужність</span>
                <div id="power-value" class="text-4xl font-extrabold text-white">--- <span class="text-xl text-emerald-400">Вт</span></div>
            </div>

            <!-- Додаткові параметри -->
            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-700">
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-xs text-slate-400 block">Генерація за день</span>
                    <span id="today-energy" class="text-lg font-bold text-slate-200">--- кВт·год</span>
                </div>
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-xs text-slate-400 block">Статус логера</span>
                    <span id="logger-status" class="text-sm font-semibold text-slate-300">PFQ0G620VL</span>
                </div>
            </div>
        </div>

        <!-- Час останнього оновлення -->
        <div class="text-center">
            <p class="text-xs text-slate-500">Оновлено: <span id="updated-time">---</span></p>
        </div>
    </div>

    <!-- Кнопка оновлення -->
    <div class="max-w-md mx-auto w-full pt-4">
        <button onclick="loadInverterData()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
            <span>Оновити дані</span>
        </button>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function loadInverterData() {
            const statusBadge = document.getElementById('status-badge');
            const powerValue = document.getElementById('power-value');
            const todayEnergy = document.getElementById('today-energy');
            const updatedTime = document.getElementById('updated-time');

            try {
                // Додаємо випадковий параметр, щоб браузер не кешував старий файл data.json
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Помилка завантаження файлу');
                
                const data = await response.json();
                
                updatedTime.innerText = data.updated_at || 'Невідомо';

                if (data.status === 'success' && data.plant_data) {
                    statusBadge.innerText = 'Працює';
                    statusBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                    
                    // Витягуємо дані з відповіді API Growatt (залежно від структури у вашому plant_detail)
                    const pData = data.plant_data;
                    
                    // Налаштуйте ці поля під реальну структуру JSON, яку повертає ваш інвертор
                    powerValue.innerHTML = `${pData.pac || 0} <span class="text-xl text-emerald-400">Вт</span>`;
                    todayEnergy.innerText = `${pData.etoday || 0} кВт·год`;
                } else {
                    statusBadge.innerText = 'Помилка API';
                    statusBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30';
                }
            } catch (error) {
                console.error(error);
                statusBadge.innerText = 'Помилка мережі';
                statusBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30';
            }
        }

        // Завантажуємо дані при відкритті міні-аппу
        loadInverterData();
    </script>
</body>
</html>

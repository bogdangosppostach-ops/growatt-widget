<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growatt Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.success { background-color: #065f46; color: #34d399; }
        .badge.error { background-color: #7f1d1d; color: #fca5a5; }
        .metric-value {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: #34d399;
            margin: 20px 0;
        }
        .error-box {
            background-color: #7f1d1d;
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-all;
        }
        .btn {
            background-color: #059669;
            color: white;
            border: none;
            width: 100%;
            max-width: 400px;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div>
                <h3>Інвертор</h3>
                <div style="font-size: 12px; color: #94a3b8;" id="plant-id">Plant ID: 4137574</div>
            </div>
            <div id="status-badge" class="badge error">Очікування</div>
        </div>

        <div style="font-size: 13px; color: #94a3b8; text-align: center;">ПОТУЖНІСТЬ</div>
        <div class="metric-value" id="power">--- Вт</div>
        
        <div id="error-container"></div>
        <div style="font-size: 11px; color: #64748b; text-align: center; margin-top: 15px;" id="updated-at">Оновлено: ніколи</div>
    </div>

    <button class="btn" onclick="loadData()">Оновити дані</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function loadData() {
            const badge = document.getElementById('status-badge');
            badge.className = 'badge error';
            badge.innerText = 'Завантаження...';
            
            const jsonUrl = 'https://raw.githubusercontent.com/bogdangosppostach-ops/growatt-widget/main/data.json?t=' + new Date().getTime();

            fetch(jsonUrl)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('updated-at').innerText = `Оновлено: ${data.updated_at || 'щойно'}`;
                    
                    if (data.status === 'success') {
                        badge.className = 'badge success';
                        badge.innerText = 'Працює';
                        const pd = data.plant_data;
                        document.getElementById('power').innerText = (pd.invetorPower || 0) + ' Вт';
                        document.getElementById('error-container').innerHTML = '';
                    } else {
                        badge.className = 'badge error';
                        badge.innerText = 'Помилка API';
                        document.getElementById('error-container').innerHTML = `<div class="error-box">Помилка скрипта: ${data.error || 'Невідомо'}</div>`;
                    }
                })
                .catch(err => {
                    badge.className = 'badge error';
                    badge.innerText = 'Збій мережі';
                    document.getElementById('error-container').innerHTML = `<div class="error-box">${err.message}</div>`;
                });
        }

        loadData();
    </script>
</body>
</html>

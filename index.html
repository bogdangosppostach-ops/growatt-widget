<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growatt Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.success { background-color: #065f46; color: #34d399; }
        .badge.error { background-color: #7f1d1d; color: #fca5a5; }
        .metric-title {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: #34d399;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .sub-card {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .sub-value {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
            margin-top: 4px;
        }
        .footer {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
        }
        .btn {
            background-color: #059669;
            color: white;
            border: none;
            width: 100%;
            max-width: 400px;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { background-color: #047857; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div>
                <div class="title">Сонячна станція</div>
                <div style="font-size: 12px; color: #94a3b8;" id="plant-id">Plant ID: ...</div>
            </div>
            <div id="status-badge" class="badge error">Завантаження...</div>
        </div>

        <div class="metric-title">Поточна потужність</div>
        <div class="metric-value" id="power">--- Вт</div>

        <div class="grid">
            <div class="sub-card">
                <div class="metric-title" style="margin-bottom: 4px;">Генерація за день</div>
                <div class="sub-value" id="today-energy">--- кВт·год</div>
            </div>
            <div class="sub-card">
                <div class="metric-title" style="margin-bottom: 4px;">Статус логера</div>
                <div class="sub-value" style="font-size: 13px; color: #38bdf8;" id="logger-sn">PFQ0G620VL</div>
            </div>
        </div>
        
        <div class="footer" id="updated-at">Оновлено: ніколи</div>
    </div>

    <button class="btn" onclick="loadData()">Оновити дані</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function loadData() {
            // Використовуємо пряме посилання GitHub Raw, щоб обійти кешування сторінки
            const jsonUrl = 'https://raw.githubusercontent.com/bogdangosppostach-ops/growatt-widget/main/data.json?_=' + new Date().getTime();

            fetch(jsonUrl)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('plant-id').innerText = `Plant ID: ${data.plant_id}`;
                    document.getElementById('updated-at').innerText = `Оновлено: ${data.updated_at}`;

                    const badge = document.getElementById('status-badge');
                    
                    if (data.status === 'success' && data.plant_data) {
                        badge.className = 'badge success';
                        badge.innerText = 'Працює';

                        // Витягуємо дані зі структури Growatt API
                        const pd = data.plant_data;
                        document.getElementById('power').innerText = (pd.invetorPower || pd.power || 0) + ' Вт';
                        document.getElementById('today-energy').innerText = (pd.todayEnergy || 0) + ' кВт·год';
                    } else {
                        badge.className = 'badge error';
                        badge.innerText = 'Помилка API';
                        document.getElementById('power').innerText = '--- Вт';
                        document.getElementById('today-energy').innerText = '--- кВт·год';
                    }
                })
                .catch(err => {
                    console.error('Помилка завантаження:', err);
                    const badge = document.getElementById('status-badge');
                    badge.className = 'badge error';
                    badge.innerText = 'Збій мережі';
                });
        }

        // Завантажуємо дані при відкритті міні-аппу
        loadData();
    </script>
</body>
</html>
